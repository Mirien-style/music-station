<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirien的原創詩歌小站</title>
<style>
.song.coming{ opacity: 0.55; }
.coming-tag{ background: #555 !important; color: #fff !important; }
  
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#111014;color:#fff}
header{padding:28px 20px 10px;max-width:1100px;margin:auto} header h1{margin:0;font-size:30px} header p{color:#bbb;margin:8px 0 0}
.wrap{max-width:1100px;margin:auto;padding:16px 20px 40px;display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:#1e1c22;border:1px solid #2f2b36;border-radius:18px;padding:16px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px} input,select{flex:1;min-width:120px;background:#2a2731;color:#fff;border:1px solid #3a3644;border-radius:10px;padding:10px}
.song{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#fff;padding:12px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.song.active,.song:hover{background:#2a2731;border-color:#ff8a3c}
.num{width:26px;height:26px;border-radius:50%;background:#333;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.tag{font-size:12px;background:#ff8a3c;color:#111;padding:3px 8px;border-radius:99px;white-space:nowrap}
.cover{height:170px;border-radius:14px;display:grid;place-items:center;font-size:44px;font-weight:900;color:#111}
h2{margin:14px 0 4px;font-size:26px} .sub{color:#bbb;margin:0 0 14px}
audio{width:100%;margin:10px 0} .btns{display:flex;gap:8px} button{cursor:pointer;background:#ff8a3c;border:0;color:#111;font-weight:700;padding:11px 14px;border-radius:10px}
button.ghost{background:#2a2731;color:#fff} .lyrics{white-space:pre-wrap;line-height:2;background:#15141a;border-radius:12px;padding:16px;max-height:420px;overflow:auto}
code{background:#000;padding:2px 6px;border-radius:6px} .how{color:#ddd;line-height:1.9} .how li{margin:6px 0}
</style>
</head>
<body>
<header><h1>✞ Mirien的原創詩歌小站</h1><p></p></header>
<div class="wrap">
  <div class="card">
    <div class="controls"><input id="search" placeholder="搜尋歌名…"><select id="filter"><option value="全部">全部</option><option>吉他試唱</option><option>鋼琴演奏</option></select></div>
    <div id="list"></div>
  </div>
  <div class="card">
    <div id="cover" class="cover">♪</div>
    <h2 id="title">載入中…</h2><p class="sub" id="meta"></p>
    <audio id="player" controls preload="metadata"></audio>
    <div class="btns"><button id="prev">⏮ 上一首</button><button id="next">下一首 ⏭</button><button class="ghost" id="autoBtn">連續播放：開</button></div>
    <!-- <p id="note" style="color:#bbb"></p> -->
    <h3>歌詞 / 演奏說明</h3><div class="lyrics" id="lyrics"></div>
  </div>
</div>
<div class="wrap" style="grid-template-columns:1fr"><div class="card how">
<h3>🎵 之後怎麼加新歌？只要 3 步（不用改 index.html）</h3>
<ol>
<li>把新的 mp3 上傳到 <code>audio/</code> 資料夾，例如 <code>audio/new-song.mp3</code></li>
<li>打開 <code>songs.json</code>，複製一首歌的 <code>{ ... }</code> 貼到最後，改 <code>title</code>、<code>version</code>、<code>audio</code>、<code>lyrics</code></li>
<li>Commit → 等 1 分鐘 → 重新整理網頁，新歌就出現了</li>
</ol>
<p>舊的獨立頁面（例如 no-longer/）不用刪除，繼續留著當分享連結就好。</p>
</div></div>
<script>
let songs=[], current=0, auto=true, filtered=[];
const list=document.getElementById('list'), player=document.getElementById('player');
async function load(){ const r=await fetch('songs.json'); songs=await r.json(); applyFilter(); play(0); }
function applyFilter(){ const q=document.getElementById('search').value.trim(); const f=document.getElementById('filter').value;
 filtered=songs.filter(s=>(f==='全部'||s.category===f)&&(!q||(s.work||s.title).includes(q)||s.version.includes(q))); renderList(); }
function renderList(){
  list.innerHTML = filtered.map(s => {
    const idx = songs.indexOf(s);
    const isComing = s.status === "即將推出";
    return `<button class="song ${idx===current?'active':''} ${isComing?'coming':''}" onclick="play(${idx})">
      <span class="num">${idx+1}</span>
      <span style="flex:1"><b>${s.work}</b><br>
      <small style="color:#bbb">${s.version}</small></span>
      ${isComing ? `<span class="tag coming-tag">即將推出</span>` : `<span class="tag">${s.status}</span>`}
    </button>`
  }).join('');
}
function play(i){ if(!songs[i])return; current=i; const s=songs[i]; 
// 如果是即將推出，就不要去抓 mp3
  if(s.status === "即將推出"){
    document.getElementById('title').textContent = s.work + ' — ' + s.version;
    document.getElementById('meta').textContent = s.note || '即將推出，敬請期待';
    document.getElementById('lyrics').textContent = '這首還在準備中，錄好後就會在這裡上架。';
    player.removeAttribute('src');
    player.load();
    renderList();
    return;
  }

document.getElementById('title').textContent=(s.work||s.title)+' — '+s.version; document.getElementById('meta').textContent = s.note || ''; // 先清空，等等去抓 txt
document.getElementById('lyrics').textContent = '載入中...';
if(s.lyricsFile){
  fetch(s.lyricsFile).then(r => r.text()).then(t => {
    document.getElementById('lyrics').textContent = t;
  });
} else {
  document.getElementById('lyrics').textContent = s.lyrics || '';
} const c=document.getElementById('cover'); c.style.background=s.coverColor||'#ff8a3c'; c.textContent=s.title.slice(0,1); player.src=s.audio; player.play().catch(()=>{}); renderList(); }
document.getElementById('search').addEventListener('input',applyFilter); document.getElementById('filter').addEventListener('change',applyFilter);
document.getElementById('prev').onclick=()=>play((current-1+songs.length)%songs.length);
document.getElementById('next').onclick=()=>play((current+1)%songs.length);
document.getElementById('autoBtn').onclick=(e)=>{auto=!auto; e.target.textContent='連續播放：'+(auto?'開':'關')};
player.addEventListener('ended',()=>{ if(auto) play((current+1)%songs.length) });
load();
</script>
</body></html>
