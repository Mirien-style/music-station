<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirien｜原創詩歌</title>
<style>
.song.coming{ opacity: 0.55; }
.coming-tag{ background: #8AA8C8 !important; color: #fff !important; }
  
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#F4F8FC;color:#1A2E4A}
header{position:fixed;top:0;left:0;right:0;z-index:101;background:#FFFFFF;text-align:center;padding:16px 20px 10px;max-width:1100px;margin:auto;border-bottom:1px solid #D6E4F0} 
header h1{margin:0;font-size:30px;color:#123A6B;text-shadow:0 0 8px rgba(120,180,240,0.45),0 0 18px rgba(120,180,240,0.30),0 0 32px rgba(120,180,240,0.20)} 
header p{color:#6B829E;margin:8px 0 0}
.wrap{max-width:1100px;margin:auto;padding:16px 20px 40px;display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:820px){
  .wrap{display:flex;flex-direction:column;gap:0;padding:0 12px;background:#EAF2FA;}
  .wrap .card{border-radius:0;}
  .wrap .card:first-child{order:2; margin-top:380px;}
  .wrap .card:last-child{
  order:1;
  position:fixed;
  top:200px;
  left:12px;
  right:12px;
  z-index:101;
  background:#FFFFFF !important;
  background-color:#FFFFFF !important;
  opacity:1 !important;
  border-bottom:1px solid #D6E4F0;
    padding:0 16px 16px 16px;
  margin-bottom:0;
}  /* 播放器放上面 */}
.card{background:#FFFFFF;border:1px solid #D6E4F0;border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(18,58,107,0.06)}
.controls{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:-16px;z-index:20;background:#4E7AA8 !important;background-color:#4E7AA8 !important;opacity:1 !important;margin:-16px -16px 12px;padding:16px;border-bottom:1px solid #3A5F8A} 
input{flex:1 1 100%;min-width:0;background:#FFFFFF;color:#1A2E4A;border:1px solid #C8D9EA;border-radius:10px;padding:10px}
select{flex:1 1 0;min-width:0;background:#FFFFFF;color:#1A2E4A;border:1px solid #C8D9EA;border-radius:10px;padding:10px}
.song{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#1A2E4A;padding:12px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.song.active,.song:hover{background:#EAF2FA;border-color:#2F7AC0}
.num{width:26px;height:26px;border-radius:50%;background:#DCEAF8;color:#123A6B;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.tag{font-size:12px;background:#2F7AC0;color:#fff;padding:3px 8px;border-radius:99px;white-space:nowrap}
.cover{height:260px;border-radius:14px;display:grid;place-items:center;font-size:64px;font-weight:900;color:#fff;background-size:cover;background-position:center 38%;}
@media(max-width:820px){
       .cover{height:150px !important; border-radius:0; margin:-0px -16px 0 -16px;}
}
h2{margin:14px 0 4px;font-size:26px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:#123A6B} .sub{color:#6B829E;margin:0 0 14px}
audio{width:100%;margin:10px 0} .btns{display:flex;gap:8px} button{cursor:pointer;background:#1E5AA8;border:0;color:#fff;font-weight:700;padding:11px 14px;border-radius:10px}
button.ghost{background:#EAF2FA;color:#123A6B} 
.lyrics{white-space:pre-wrap;line-height:2;background:#F2F7FC;color:#1A2E4A;border-radius:12px;padding:16px;border:1px solid #D6E4F0}
.lyrics.collapsed{max-height:0;padding-top:0;padding-bottom:0;overflow:hidden;border:0;}
.lyrics{transition:max-height 0.3s ease, padding 0.3s ease;}  
code{background:#EAF2FA;color:#123A6B;padding:2px 6px;border-radius:6px} .how{color:#334E6E;line-height:1.9} .how li{margin:6px 0}
@media(min-width:821px){
  body{
    padding-top: 96px;
  }
  .wrap{
    height: calc(100vh - 116px);
    align-items: start;
  }
  .wrap .card{
    max-height: 100%;
    overflow-y: auto;
  }
}
@media(max-width:820px){
  .controls{
    position: fixed !important;
    top: 92px !important;
    left: 0 !important;
    right: 0 !important;
    z-index: 100 !important;
    background: #4E7AA8 !important;
    background-color: #4E7AA8 !important;
    opacity: 1 !important;
    border-bottom: 1px solid #3A5F8A;
    padding: 10px 12px !important;
    margin: 0 !important;
  }
  body{
    padding-top: 204px;
  }
}
</style>
</head>
<body>
<header><h1>✞ Mirien｜原創詩歌</h1><p>Demo Ver.</p></header>
<div class="wrap">
  <div class="card">
    <div class="controls"><input id="search" placeholder="搜尋歌名…">
    <select id="filter"><option value="全部">全部模式</option><option>鋼琴演示</option><option>吉他彈唱</option><option>官方正式</option></select><select id="filterStatus"><option value="全部">全部狀態</option><option>已上架</option><option>未上架</option></select></div>
    <div id="list"></div>
  </div>
  <div class="card" id="playerCard">
    <div id="cover" class="cover">♪</div>
    <h2 id="title">載入中…</h2>
    <audio id="player" controls preload="metadata"></audio>
    <p class="sub" id="meta" style="margin:8px 0 0;"></p>
    <p class="sub" id="credits" style="font-size:14px; color:#6B829E; margin:0; line-height:1.3; display:none;"></p>
    <div style="display:flex;justify-content:space-between;align-items:center; margin-bottom:8;">
  <h3 style="margin:12px 0;color:#123A6B;">歌詞 / 歌曲說明</h3>
  <button id="lyricsToggle" class="ghost" style="padding:6px 12px;font-size:13px;">展開 ▼</button>
</div>
<div class="lyrics" id="lyrics"></div>
  </div>
</div>
<script>
let songs=[], current=0, auto=true, filtered=[];
const MODE_SETTINGS = {
  "鋼琴演示": "show",
  "吉他彈唱": "show",
  "官方正式": "hide"
};
const list=document.getElementById('list'), player=document.getElementById('player');
function syncModeOptions(){ const sel=document.getElementById('filter'); [...sel.options].forEach(o=>{ if(o.value==="全部") return; o.hidden = (MODE_SETTINGS[o.text]==="hide"); }); if(MODE_SETTINGS[sel.value]==="hide") sel.value="全部"; }
async function load(){ const r=await fetch('songs.json'); songs=await r.json(); syncModeOptions(); applyFilter(); play(0); }
function applyFilter(){ const q=document.getElementById('search').value.trim(); const f=document.getElementById('filter').value; const fs=document.getElementById('filterStatus').value;
  filtered=songs.filter(s=>{ if(MODE_SETTINGS[s.category]==="hide") return false; let ok=true; if(fs==='已上架') ok=s.status!=="未上架"; else if(fs==='未上架') ok=s.status==="未上架"; if(f!=='全部') ok=ok&&s.category===f; return ok&&(!q||(s.work||s.title).includes(q)||s.version.includes(q)); }); renderList(); }
function renderList(){
    list.innerHTML = filtered.map((s, displayIdx) => {
    const idx = songs.indexOf(s);
    const isComing = s.status === "未上架";
    return `<button class="song ${idx===current?'active':''} ${isComing?'coming':''}" onclick="play(${idx})">
      <span class="num">${displayIdx+1}</span>
      <span style="flex:1"><b>${s.work}</b><br>
      <small style="color:#6B829E">${s.version}</small></span>
      ${isComing ? `<span class="tag coming-tag">未上架</span>` : `<span class="tag">${s.status}</span>`}
    </button>`
  }).join('');
}
function play(i){ if(!songs[i])return; current=i; const s=songs[i]; 
  if(s.status === "未上架"){
    document.getElementById('title').innerHTML = s.work + '<span style="color:#6B829E; font-size:20px; ">(' + s.version + ')</span>';
    document.getElementById('meta').textContent = s.year ? '創作年份．' + s.year : '未上架，敬請期待';
    document.getElementById('lyrics').textContent = '這首還在準備中，錄好後就會在這裡上架。';
    document.getElementById('credits').innerHTML = '詞：' + (s.lyricist || '—') + '<br>曲：' + (s.composer || '—');
    const c1 = document.getElementById('cover');
    c1.style.backgroundImage = 'none';
    c1.style.background = s.coverColor || '#2F7AC0';
    c1.textContent = '♪';
    player.removeAttribute('src');
    player.load();
    renderList();
    return;
  }
document.getElementById('title').innerHTML=(s.work||s.title)+'<span style="color:#6B829E; font-size:20px; ">('+s.version+')</span>';   
document.getElementById('meta').textContent = s.year ? '創作年份．' + s.year : '';
document.getElementById('credits').innerHTML = '詞：' + (s.lyricist || '—') + '<br>曲：' + (s.composer || '—');
document.getElementById('lyrics').textContent = '載入中...';
if(s.lyricsFile){
  fetch(s.lyricsFile).then(r => r.text()).then(t => {
    document.getElementById('lyrics').textContent = t;
  });
} else {
  document.getElementById('lyrics').textContent = s.lyrics || '';
} const c=document.getElementById('cover');
c.style.background = '';
c.style.backgroundImage = "url('images/cover.jpg?v=2')";
c.textContent = ''; player.src=s.audio; renderList(); }
document.getElementById('search').addEventListener('input',applyFilter); 
document.getElementById('filter').addEventListener('change',applyFilter);
document.getElementById('filterStatus').addEventListener('change',applyFilter); 
document.getElementById('filter').addEventListener('change',applyFilter);
let lyricsOpen = false;
const lyricsBox = document.getElementById('lyrics');
const lyricsBtn = document.getElementById('lyricsToggle');
lyricsBox.classList.add('collapsed');
lyricsBtn.textContent = '展開 ▼';
const playerCard = document.getElementById('playerCard');
function updatePlayerMode(){
  if(window.innerWidth > 820) return;
  const listCard = document.querySelector('.wrap .card:first-child');
  const controls = document.querySelector('.controls');
  if(lyricsOpen){
    playerCard.style.position = 'relative';
    playerCard.style.top = 'auto';
    playerCard.style.left = 'auto';
    playerCard.style.right = 'auto';
    playerCard.style.zIndex = '1';
    if(listCard) listCard.style.marginTop = '0';
  } else {
    playerCard.style.position = 'fixed';
    const bottom = controls ? controls.getBoundingClientRect().bottom : 200;
    playerCard.style.top = bottom + 'px';
    playerCard.style.left = '12px';
    playerCard.style.right = '12px';
    playerCard.style.zIndex = '101';
    if(listCard) listCard.style.marginTop = '380px';
  }
}
lyricsBtn.onclick = () => {
  lyricsOpen = !lyricsOpen;
  if(lyricsOpen){
    lyricsBox.classList.remove('collapsed');
    lyricsBtn.textContent = '收起 ▲';
  } else {
    lyricsBox.classList.add('collapsed');
    lyricsBtn.textContent = '展開 ▼';
  }
  updatePlayerMode();
};
window.addEventListener('resize', updatePlayerMode);
window.addEventListener('load', updatePlayerMode);
load();
load();
</script>
</body></html>
