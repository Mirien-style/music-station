<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirien｜原創詩歌</title>
<style>
.song.coming{ opacity: 0.55; }
.coming-tag{ background: #6E6E6E !important; color: #fff !important; }
  
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#17171A;color:#F2F2F2}
header{position:fixed;top:0;left:0;right:0;z-index:101;background:#1C1C1F;text-align:center;padding:16px 20px 10px;max-width:1100px;margin:auto;border-bottom:1px solid #3A3A3E} 
header h1{margin:0;font-size:30px;color:#F2DFA0;text-shadow:0 0 8px rgba(242,223,160,0.55),0 0 18px rgba(242,223,160,0.35),0 0 32px rgba(242,223,160,0.20)} 
header p{color:#A8A8A8;margin:8px 0 0}
.wrap{max-width:1100px;margin:auto;padding:16px 20px 40px;display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:820px){
  .wrap{display:flex;flex-direction:column;gap:0;padding:0 12px;background:#26262B;}
  .wrap .card{border-radius:0;}
  .wrap .card:first-child{order:2; margin-top:0;}
  .wrap .card:last-child{
  order:1;
  position:fixed;
  top:200px;
  left:12px;
  right:12px;
  z-index:101;
  background:#26262B !important;
  background-color:#26262B !important;
  opacity:1 !important;
  border-bottom:1px solid #3A3A3E;
    padding:0 16px 16px 16px;
  margin-bottom:0;
}  /* 播放器放上面 */}
.card{background:#26262B;border:1px solid #3A3A3E;border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,0.35)}
.controls{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:-16px;z-index:20;background:#F2DFA0 !important;background-color:#F2DFA0 !important;opacity:1 !important;margin:-16px -16px 12px;padding:16px;border-bottom:1px solid #D9C47E} 
input{flex:1 1 100%;min-width:0;background:#1E1E22;color:#F2F2F2;border:1px solid #3A3A3E;border-radius:10px;padding:10px}
select{flex:1 1 0;min-width:0;background:#1E1E22;color:#F2F2F2;border:1px solid #3A3A3E;border-radius:10px;padding:10px}
.song{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#F2F2F2;padding:12px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.song.active,.song:hover{background:#3A3A40;border-color:#F2DFA0}
.num{width:26px;height:26px;border-radius:50%;background:#F2DFA0;color:#2A2410;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.tag{font-size:12px;background:#F2DFA0;color:#2A2410;padding:3px 8px;border-radius:99px;white-space:nowrap}
.cover{height:260px;border-radius:14px;display:grid;place-items:center;font-size:64px;font-weight:900;color:#2A2410;background-size:cover;background-position:center 38%;}
@media(max-width:820px){
       .cover{height:150px !important; border-radius:0; margin:-0px -16px 0 -16px;}
}
h2{margin:14px 0 4px;font-size:26px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:#FFFFFF} .sub{color:#A8A8A8;margin:0 0 14px}
/* 播放器歌名：同一行，左歌名、右版本，中間撐開 */
#playerCard h2#title{
  display:flex;
  flex-direction:row;
  justify-content:space-between;
  align-items:baseline;
  text-align:left;
  gap:16px;
  margin:16px 0 8px;
  line-height:1.3;
}
#title .t-work{
  display:block;
  flex:1 1 auto;
  min-width:0;
  font-size:26px;
  font-weight:800;
  color:#FFFFFF;
}
#title .t-ver{
  display:block;
  flex-shrink:0;
  white-space:nowrap;
  font-size:16px;
  font-weight:500;
  color:#A8A8A8;
}
audio{width:100%;margin:12px 0 10px} .btns{display:flex;gap:8px} button{cursor:pointer;background:#F2DFA0;border:0;color:#2A2410;font-weight:700;padding:11px 14px;border-radius:10px}
button.ghost{background:#3A3A40;color:#F2DFA0} 
.lyrics{white-space:pre-wrap;line-height:2;background:#1E1E22;color:#EDEDED;border-radius:12px;padding:16px;border:1px solid #3A3A3E}
.lyrics.collapsed{max-height:0;padding-top:0;padding-bottom:0;overflow:hidden;border:0;}
.lyrics{transition:max-height 0.3s ease, padding 0.3s ease;}  
code{background:#333333;color:#F2DFA0;padding:2px 6px;border-radius:6px} .how{color:#D0D0D0;line-height:1.9} .how li{margin:6px 0}
@media(min-width:821px){
  body{
    padding-top: 96px;
  }
  .wrap{
    height: calc(100vh - 116px);
    align-items: start;
  }
  .wrap .card{
    max-height: 100%;
    overflow-y: auto;
  }
  #playerCard{
    overflow-y: auto;
  }
}
@media(max-width:820px){
  .controls{
    position: fixed !important;
    top: 92px !important;
    left: 0 !important;
    right: 0 !important;
    z-index: 100 !important;
    background: #F2DFA0 !important;
    background-color: #F2DFA0 !important;
    opacity: 1 !important;
    border-bottom: 1px solid #D9C47E;
    padding: 10px 12px !important;
    margin: 0 !important;
  }
  body{
    padding-top: 0;
  }
  #playerCard.lyrics-open .lyrics{
    max-height: 220px;
    overflow-y: auto;
  }
}
</style>
</head>
