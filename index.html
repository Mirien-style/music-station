<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirien｜原創詩歌</title>
<style>
.song.coming{ opacity: 0.55; }
.coming-tag{ background: #6E6E6E !important; color: #fff !important; }
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#17171A;color:#F2F2F2}
header{position:fixed;top:0;left:0;right:0;z-index:101;background:#1C1C1F;text-align:center;padding:16px 20px 10px;max-width:1100px;margin:auto;border-bottom:1px solid #3A3A3E} 
header h1{margin:0;font-size:30px;color:#F2DFA0;text-shadow:0 0 8px rgba(242,223,160,0.55),0 0 18px rgba(242,223,160,0.35),0 0 32px rgba(242,223,160,0.20)} 
header p{color:#A8A8A8;margin:8px 0 0}
.wrap{max-width:1100px;margin:auto;padding:16px 20px 40px;display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:820px){
  .wrap{display:flex;flex-direction:column;gap:0;padding:0 12px;background:#26262B;}
  .wrap .card{border-radius:0;}
  .wrap .card:first-child{order:2; margin-top:0;}
  .wrap .card:last-child{
  order:1;position:fixed;top:200px;left:12px;right:12px;z-index:101;
  background:#26262B !important;background-color:#26262B !important;opacity:1 !important;
  border-bottom:1px solid #3A3A3E;padding:0 16px 16px 16px;margin-bottom:0;
}  /* 播放器放上面 */}
.card{background:#26262B;border:1px solid #3A3A3E;border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,0.35)}
.controls{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:-16px;z-index:20;background:#F2DFA0 !important;background-color:#F2DFA0 !important;opacity:1 !important;margin:-16px -16px 12px;padding:16px;border-bottom:1px solid #D9C47E} 
input{flex:1 1 100%;min-width:0;background:#1E1E22;color:#F2F2F2;border:1px solid #3A3A3E;border-radius:10px;padding:10px}
select{flex:1 1 0;min-width:0;background:#1E1E22;color:#F2F2F2;border:1px solid #3A3A3E;border-radius:10px;padding:10px}
.song{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#F2F2F2;padding:12px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.song.active,.song:hover{background:#3A3A40;border-color:#F2DFA0}
.num{width:26px;height:26px;border-radius:50%;background:#F2DFA0;color:#2A2410;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.tag{font-size:12px;background:#F2DFA0;color:#2A2410;padding:3px 8px;border-radius:99px;white-space:nowrap}
.cover{height:260px;border-radius:14px;display:grid;place-items:center;font-size:64px;font-weight:900;color:#2A2410;background-size:cover;background-position:center 38%;}
@media(max-width:820px){
  .cover{height:150px !important; border-radius:0; margin:-0px -16px 0 -16px;}
}
h2{margin:14px 0 4px;font-size:26px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:#FFFFFF} .sub{color:#A8A8A8;margin:0 0 14px}
/* 播放器歌名：置中、上下兩排 */
#playerCard h2#title{
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  text-align:center !important;
  gap:4px !important;
  margin:18px 0 10px !important;
  line-height:1.3 !important;
}
#title .t-work{display:block !important;width:100%;text-align:center !important;font-size:26px;font-weight:800;color:#FFFFFF;}
#title .t-ver{display:block !important;width:100%;text-align:center !important;font-size:16px;font-weight:500;color:#A8A8A8;}
/* 置中歌名下面那顆「點我開啟」按鈕，也置中 */
.open-lyrics-wrap{text-align:center !important;margin:14px 0 6px;}
#openLyricsBtn{display:inline-block;background:#F2DFA0;color:#2A2410;font-weight:800;font-size:15px;padding:12px 22px;border-radius:99px;text-decoration:none;}
#openLyricsBtn.disabled{opacity:0.45;pointer-events:none;}
#openLyricsBtn .txt-mobile{display:none;}
#playerCard .sub#meta{text-align:center !important;}
audio{width:100%;margin:12px 0 10px} .btns{display:flex;gap:8px} button{cursor:pointer;background:#F2DFA0;border:0;color:#2A2410;font-weight:700;padding:11px 14px;border-radius:10px}
button.ghost{background:#3A3A40;color:#F2DFA0} 
code{background:#333333;color:#F2DFA0;padding:2px 6px;border-radius:6px} .how{color:#D0D0D0;line-height:1.9} .how li{margin:6px 0}
@media(min-width:821px){
  body{padding-top: 96px;}
  .wrap{height: calc(100vh - 116px);align-items: start;}
  .wrap .card{max-height: 100%;overflow-y: auto;}
  #playerCard{overflow-y: auto;}
}
@media(max-width:820px){
  .controls{position: fixed !important;top: 92px !important;left: 0 !important;right: 0 !important;z-index: 100 !important;background: #F2DFA0 !important;background-color: #F2DFA0 !important;opacity: 1 !important;border-bottom: 1px solid #D9C47E;padding: 10px 12px !important;margin: 0 !important;}
  body{padding-top: 0;}
  /* 手機版按鈕文字換成 👇 */
  #openLyricsBtn .txt-desktop{display:none;}
  #openLyricsBtn .txt-mobile{display:inline;}
}
</style>
</head>
<body>
<header><h1>✞ Mirien｜原創詩歌</h1><p>Demo Ver.</p></header>
<div class="wrap">
  <div class="card">
    <div class="controls"><input id="search" placeholder="搜尋歌名…">
    <select id="filter"><option value="全部">全部模式</option><option>鋼琴演示</option><option>吉他彈唱</option><option>官方正式</option></select><select id="filterStatus"><option value="全部">全部狀態</option><option>已上架</option><option>未上架</option></select></div>
    <div id="list"></div>
  </div>
  <div class="card" id="playerCard">
    <div id="cover" class="cover">♪</div>
    <h2 id="title">載入中…</h2>
    <audio id="player" controls preload="metadata"></audio>
    <p class="sub" id="meta" style="margin:8px 0 0;"></p>
    <p class="sub" id="credits" style="font-size:14px; color:#A8A8A8; margin:0; line-height:1.3; display:none;"></p>
    <div class="open-lyrics-wrap">
      <a id="openLyricsBtn" href="#" target="_blank" rel="noopener"><span class="txt-desktop">點我開啟🖱</span><span class="txt-mobile">點我開啟👇</span></a>
    </div>
  </div>
</div>
<script>
let songs=[], current=0, auto=true, filtered=[];
let currentLyricsUrl = '';
const MODE_SETTINGS = {"鋼琴演示":"show","吉他彈唱":"show","官方正式":"hide"};
const list=document.getElementById('list'), player=document.getElementById('player');
const openLyricsBtn = document.getElementById('openLyricsBtn');
function setLyricsButton(url){
  currentLyricsUrl = url || '';
  if(currentLyricsUrl){
    openLyricsBtn.href = currentLyricsUrl;
    openLyricsBtn.target = '_blank';
    openLyricsBtn.classList.remove('disabled');
  } else {
    openLyricsBtn.href = '#';
    openLyricsBtn.removeAttribute('target');
    openLyricsBtn.classList.add('disabled');
  }
}
openLyricsBtn.addEventListener('click', (e)=>{
  if(!currentLyricsUrl){ e.preventDefault(); alert('這首還沒有歌詞檔'); }
});
function syncModeOptions(){ const sel=document.getElementById('filter'); [...sel.options].forEach(o=>{ if(o.value==="全部") return; o.hidden = (MODE_SETTINGS[o.text]==="hide"); }); if(MODE_SETTINGS[sel.value]==="hide") sel.value="全部"; }
async function load(){
  try{
    const r = await fetch('songs.json');
    if(!r.ok) throw new Error('songs.json HTTP ' + r.status);
    songs = await r.json();
    if(!Array.isArray(songs) || songs.length===0) throw new Error('songs.json 是空的');
    syncModeOptions(); applyFilter(); play(0);
  }catch(e){
    console.error(e);
    list.innerHTML = '<p style="padding:12px;line-height:1.8;color:#FFB0B0">載入失敗：找不到 songs.json<br>請確認 songs.json 跟 index.html 在同一個資料夾。</p>';
    document.getElementById('title').innerHTML = '<span class="t-work">載入失敗</span><span class="t-ver"></span>';
    setLyricsButton('');
  }
}
function applyFilter(){ const q=document.getElementById('search').value.trim(); const f=document.getElementById('filter').value; const fs=document.getElementById('filterStatus').value;
  filtered=songs.filter(s=>{ if(MODE_SETTINGS[s.category]==="hide") return false; let ok=true; if(fs==='已上架') ok=s.status!=="未上架"; else if(fs==='未上架') ok=s.status==="未上架"; if(f!=='全部') ok=ok&&s.category===f; return ok&&(!q||(s.work||s.title).includes(q)||s.version.includes(q)); }); renderList(); }
function renderList(){
    list.innerHTML = filtered.map((s, displayIdx) => {
    const idx = songs.indexOf(s);
    const isComing = s.status === "未上架";
    return `<button class="song ${idx===current?'active':''} ${isComing?'coming':''}" onclick="play(${idx})">
      <span class="num">${displayIdx+1}</span>
      <span style="flex:1"><b>${s.work}</b><br>
      <small style="color:#A8A8A8">${s.version}</small></span>
      ${isComing ? `<span class="tag coming-tag">未上架</span>` : `<span class="tag">${s.status}</span>`}
    </button>`
  }).join('');
}
function play(i){ if(!songs[i])return; current=i; const s=songs[i]; 
  setLyricsButton(s.lyricsFile || '');
  if(s.status === "未上架"){
    document.getElementById('title').innerHTML = '<span class="t-work">' + s.work + '</span><span class="t-ver">(' + s.version + ')</span>';
    document.getElementById('meta').textContent = s.year ? '創作年份．' + s.year : '未上架，敬請期待';
    document.getElementById('credits').innerHTML = '詞：' + (s.lyricist || '—') + '<br>曲：' + (s.composer || '—');
    const c1 = document.getElementById('cover');
    c1.style.backgroundImage = 'none';
    c1.style.background = s.coverColor || '#F2DFA0';
    c1.textContent = '♪';
    player.removeAttribute('src');
    player.load();
    renderList();
    syncDesktopHeight();
    updatePlayerMode();
    return;
  }
document.getElementById('title').innerHTML='<span class="t-work">' + (s.work||s.title) + '</span><span class="t-ver">(' + s.version + ')</span>';   
document.getElementById('meta').textContent = s.year ? '創作年份．' + s.year : '';
document.getElementById('credits').innerHTML = '詞：' + (s.lyricist || '—') + '<br>曲：' + (s.composer || '—');
const c=document.getElementById('cover');
c.style.background = '';
c.style.backgroundImage = "url('images/cover.jpg?v=2')";
c.textContent = ''; player.src=s.audio; renderList(); syncDesktopHeight(); updatePlayerMode(); }
document.getElementById('search').addEventListener('input',applyFilter); 
document.getElementById('filter').addEventListener('change',applyFilter);
document.getElementById('filterStatus').addEventListener('change',applyFilter); 
const playerCard = document.getElementById('playerCard');
function updatePlayerMode(){
  const wrapEl = document.querySelector('.wrap');
  const listCard = document.querySelector('.wrap .card:first-child');
  if(window.innerWidth > 820){
    document.body.style.paddingTop = '';
    if(wrapEl) wrapEl.style.paddingTop = '';
    if(listCard) listCard.style.marginTop = '';
    playerCard.style.position = '';
    playerCard.style.top = '';
    playerCard.style.left = '';
    playerCard.style.right = '';
    playerCard.style.zIndex = '';
    playerCard.style.maxHeight = '';
    playerCard.style.overflowY = '';
    return;
  }
  const controls = document.querySelector('.controls');
  document.body.style.paddingTop = '0px';
  if(listCard) listCard.style.marginTop = '0px';
  const bottom = controls ? controls.getBoundingClientRect().bottom : 204;
  playerCard.style.position = 'fixed';
  playerCard.style.top = bottom + 'px';
  playerCard.style.left = '12px';
  playerCard.style.right = '12px';
  playerCard.style.zIndex = '101';
  playerCard.style.maxHeight = '';
  playerCard.style.overflowY = 'visible';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const playerBottom = playerCard.getBoundingClientRect().bottom;
      if(wrapEl) wrapEl.style.paddingTop = (playerBottom + 12) + 'px';
    });
  });
}
function syncDesktopHeight(){
  if(window.innerWidth <= 820) return;
  const listCard = document.querySelector('.wrap .card:first-child');
  if(!listCard) return;
  playerCard.style.height = '';
  requestAnimationFrame(() => { playerCard.style.height = listCard.offsetHeight + 'px'; });
}
window.addEventListener('resize', () => { updatePlayerMode(); syncDesktopHeight(); });
window.addEventListener('load', () => { updatePlayerMode(); syncDesktopHeight(); });
load();
</script>
</body></html>
