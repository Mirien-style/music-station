<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網頁維護中-Mirien｜原創詩歌</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#17171A;color:#F2F2F2}
.card{width:100%;max-width:560px;background:#26262B;border:1px solid #3A3A3E;border-radius:18px;padding:40px 28px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,0.35)}
h1{margin:0 0 12px;font-size:26px;line-height:1.3;color:#FF8C42;text-shadow:0 0 8px rgba(255,140,66,0.55),0 0 18px rgba(255,140,66,0.35)}
.sub{margin:0 0 24px;font-size:15px;line-height:1.8;color:#A8A8A8}
.icon{font-size:48px;margin-bottom:16px}
.divider{width:48px;height:3px;background:#FF8C42;border-radius:99px;margin:0 auto 24px}
.tip{margin:0;font-size:13px;line-height:1.6;color:#6E6E6E}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛠️</div>
  <h1>✞ Mirien｜原創詩歌</h1>
  <div class="divider"></div>
  <p class="sub" style="font-size:20px;color:#FFFFFF;font-weight:800;">網頁正在維護</p>
  <p class="sub">內容正在調整中，請稍後再回來，謝謝您的等待。</p>
  <p class="tip">Mirien｜原創詩歌</p>
</div>
</body>
</html>
